packages:
  - docs

# autotel-devtools pulls in esbuild and protobufjs, both of which run install
# scripts. pnpm 10+ blocks those by default and then refuses to run anything
# else, so a fresh clone fails on `pnpm install` rather than on anything you did.
allowBuilds:
  esbuild: true
  protobufjs: true

# autotel is released alongside this workshop, so a fresh autotel release can be
# pinned here the same day. Everything else still waits out pnpm's release-age policy.
minimumReleaseAgeExclude:
  - autotel
  - autotel-*
